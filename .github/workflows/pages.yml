# GitHub Pages へ公開する（日本語版フォーク用・修正版 v2）
# 変更点（v1 から）:
# - Node 20 -> 18（本家 .tool-versions は nodejs 18.15.0、公式 CI も 18.x で yarn install + yarn build）
# - `node .yarn/releases/yarn-3.3.0.cjs install --immutable` -> `yarn install`（本家 CI と同じ呼び方。runner の yarn が .yarnrc.yml の yarnPath 経由で Berry 3.3.0 に委譲する）
# - Build に NODE_OPTIONS=--max-old-space-size=4096 を追加（巨大バンドルのビルド中のメモリ不足への備え）
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: yarn install
      - name: Build
        run: yarn build
        env:
          CI: "false"
          PUBLIC_URL: /pybricks-code
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4